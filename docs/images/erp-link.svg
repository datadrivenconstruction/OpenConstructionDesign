<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ERP link: the editor publishes a revision whose element rows and quantities feed estimate, schedule and procurement; a brief from the ERP generates a model</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="440" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="16" fill="none" stroke="#dee2e6"/>

  <!-- editor -->
  <rect x="40" y="70" width="300" height="250" rx="12" fill="#edf2ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="190" y="108" text-anchor="middle" font-size="22" font-weight="600" fill="#1c2a5e">Editor</text>
  <text x="190" y="134" text-anchor="middle" font-size="14" fill="#495057">desktop, or browser (preview)</text>
  <g font-size="15" fill="#212529">
    <text x="64" y="178">• BIM model in one SQLite file</text>
    <text x="64" y="206">• AI assistant drafts, you Apply</text>
    <text x="64" y="234">• quantities per element</text>
    <text x="64" y="262">• checks, sheets, IFC</text>
  </g>
  <text x="190" y="300" text-anchor="middle" font-size="13" fill="#495057" font-family="Consolas, monospace">.ddclink · token in OS key store</text>

  <!-- revision -->
  <rect x="450" y="70" width="300" height="250" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
  <text x="600" y="108" text-anchor="middle" font-size="22" font-weight="600" fill="#212529">Revision package</text>
  <text x="600" y="134" text-anchor="middle" font-size="14" fill="#495057" font-family="Consolas, monospace">.ddcrev  (ddc publish)</text>
  <g font-size="15" fill="#212529">
    <text x="474" y="178">• elements.parquet: rows, quantities</text>
    <text x="474" y="206">• diff against the parent revision</text>
    <text x="474" y="234">• IFC, sheets (PDF), 3D (GLB)</text>
    <text x="474" y="262">• manifest with checksums</text>
  </g>

  <!-- erp -->
  <rect x="860" y="70" width="300" height="250" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
  <text x="1010" y="108" text-anchor="middle" font-size="22" font-weight="600" fill="#1b4d2b">ERP</text>
  <text x="1010" y="134" text-anchor="middle" font-size="14" fill="#495057">prices the quantities</text>
  <g font-size="15" fill="#212529">
    <rect x="884" y="156" width="252" height="34" rx="6" fill="#ffffff" stroke="#b2f2bb"/>
    <text x="1010" y="179" text-anchor="middle">Cost estimate</text>
    <rect x="884" y="200" width="252" height="34" rx="6" fill="#ffffff" stroke="#b2f2bb"/>
    <text x="1010" y="223" text-anchor="middle">Schedule</text>
    <rect x="884" y="244" width="252" height="34" rx="6" fill="#ffffff" stroke="#b2f2bb"/>
    <text x="1010" y="267" text-anchor="middle">Procurement</text>
  </g>

  <!-- forward arrows -->
  <line x1="340" y1="160" x2="446" y2="160" stroke="#3b5bdb" stroke-width="3" marker-end="url(#a)"/>
  <text x="393" y="150" text-anchor="middle" font-size="13" fill="#3b5bdb">publish</text>
  <line x1="750" y1="160" x2="856" y2="160" stroke="#3b5bdb" stroke-width="3" marker-end="url(#a)"/>
  <text x="803" y="150" text-anchor="middle" font-size="13" fill="#3b5bdb">upload</text>

  <!-- back path: brief -->
  <path d="M1010,320 L1010,385 L190,385 L190,324" fill="none" stroke="#868e96" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/>
  <rect x="440" y="370" width="320" height="30" rx="6" fill="#ffffff"/>
  <text x="600" y="391" text-anchor="middle" font-size="14" fill="#495057">project brief → <tspan font-family="Consolas, monospace">ddc gen</tspan> → model, lock, context</text>

  <text x="40" y="44" font-size="16" font-weight="600" fill="#212529">ERP link (contract ddc-erp-link/1, build feature <tspan font-family="Consolas, monospace">link</tspan>)</text>
</svg>
