[workspace]
resolver = "2"
members = ["crates/bridge-proto", "crates/model", "crates/geom", "crates/solver", "crates/io", "crates/render", "crates/app", "crates/ui", "crates/ai", "crates/ops", "crates/gen", "crates/fem", "crates/calc", "crates/cli", "crates/script", "crates/link", "crates/net", "tools/bigfile_bench"]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
# placeholder until the public home is decided
repository = "https://github.com/datadrivenconstruction/OpenConstructionDesign"
# locked deps set the floor (uuid 1.29 needs 1.89; code itself needs 1.87)
rust-version = "1.89"

[workspace.dependencies]
rusqlite = { version = "0.41", features = ["bundled", "hooks", "backup", "fallible_uint"] }
# Instant/SystemTime that also run in the browser build (re-exports std on desktop)
web-time = "1"
thiserror = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
base64 = "0.22"
getrandom = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }

# Fuzz/mutation runs: release speed with overflow and debug assertions on.
[profile.fuzz]
inherits = "release"
overflow-checks = true
debug-assertions = true
