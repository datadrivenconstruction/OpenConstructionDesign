[package]
name = "ddc-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI assistant core: providers, wire protocols, conversation loop, tool catalog"

[dependencies]
web-time.workspace = true
base64.workspace = true
ddc-gen = { path = "../gen" }
ddc-geom = { path = "../geom" }
ddc-model = { path = "../model" }
ddc-ops = { path = "../ops" }
# recipes only: the interpreter comes with the editor
ddc-script = { path = "../script", default-features = false }
getrandom.workspace = true
ddc-net = { path = "../net" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# the stdio bridge for outside assistants runs on the desktop only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true

# the browser's random source
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

# Other platforms have no vault integration: keys stay in MemoryStore for the session.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring.workspace = true
