[package]
name = "ddc-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AI assistant core: providers, wire protocols, conversation loop, tool catalog"

[dependencies]
web-time.workspace = true
base64.workspace = true
ddc-gen = { path = "../gen" }
ddc-geom = { path = "../geom" }
ddc-model = { path = "../model" }
ddc-ops = { path = "../ops" }
# recipe texts only; the interpreter (feature `lua`) comes from the desktop editor
ddc-script = { path = "../script", default-features = false }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
native-tls.workspace = true
ureq.workspace = true

# browser build: no TLS stack of its own (AI goes through the ERP host); random from the browser
[target.'cfg(target_arch = "wasm32")'.dependencies]
ureq = { version = "2", default-features = false }
getrandom = { workspace = true, features = ["js"] }

# Other platforms have no vault integration: keys stay in MemoryStore for the session.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring.workspace = true
