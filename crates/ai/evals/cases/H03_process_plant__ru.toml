id = "H03_process_plant__ru"
tier = "hard"
group = "Технологические объекты"
title = "Chemical process plant with pipe racks (ru)"
lang = "ru"
base = "empty"

[[turn]]
say = "Небольшая химическая установка на открытой площадке: реактор с рубашкой, две ёмкости сырья, ректификационная колонна с кипятильником и конденсатором, насосы парами рабочий/резервный, пара теплообменников. Стальная эстакада высотой около 4 м с технологическими линиями между аппаратами, патрубки на каждом аппарате с реально подключёнными линиями, трубы с уклоном там, где нужен дренаж, опоры через каждые несколько метров, площадки обслуживания и лестницы с ограждением вокруг колонны и реактора, обвалование вокруг парка ёмкостей. Назови диаметры линий и среды."

[[oracle.count]]
spec = "level"
min = 1.0

[[oracle.count]]
spec = "comp:vessel|tank|reactor|column|drum|exchanger|boiler|condenser|reboiler"
min = 7.0

[[oracle.count]]
spec = "comp:pump"
min = 3.0

[[oracle.count]]
spec = "comp:nozzle|flange"
min = 10.0

[[oracle.count]]
spec = "mep:pipe"
min = 40.0

[[oracle.count]]
spec = "comp:support|hanger|shoe|guide|bracket"
min = 15.0

[[oracle.count]]
spec = "railing+comp:platform|grating"
min = 6.0

[[oracle.count]]
spec = "comp:ladder+stair"
min = 3.0

[[oracle.count]]
spec = "col+beam"
min = 20.0

[[oracle.count]]
spec = "comp:valve"
min = 8.0

[[oracle.geom]]
kind = "mep_connected"
ends_min = 0.9

[[oracle.geom]]
kind = "mep_clashes"
max = 0.0

[[oracle.text]]
name = "lists lines with service and size"
re = "(DN ?\\d+|\\d+ ?mm|\\d+\\\"|NPS)"

[oracle.ifc.classes_min]
"IfcBuildingStorey" = 1
"IfcDuctSegment|IfcPipeSegment|IfcCableCarrierSegment" = 1
"IfcBeam" = 1
"IfcColumn" = 1

[[oracle.geom]]
kind = "mep_free_ends"
