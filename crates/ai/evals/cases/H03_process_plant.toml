spec = "level"
min = 1.0

[[oracle.count]]
spec = "comp:vessel|tank|reactor|column|drum|exchanger|boiler|condenser|reboiler"
min = 7.0

[[oracle.count]]
spec = "comp:pump"
min = 3.0

[[oracle.count]]
