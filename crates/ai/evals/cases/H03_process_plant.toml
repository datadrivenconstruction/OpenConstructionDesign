id = "H03_process_plant"
tier = "hard"
group = "Process facilities"
title = "Chemical process plant with pipe racks"
lang = "en"
base = "empty"

[[turn]]
say = "Small chemical process plant outdoors: a jacketed reactor, two feed tanks, a distillation column with reboiler and condenser, pumps as duty/standby pairs, a couple of heat exchangers. A steel pipe rack about 4 m high carrying the process lines between the equipment, nozzles on every vessel with the lines actually connected to them, pipes sloped where they need to drain, supports every few metres, access platforms and caged ladders round the column and reactor, and a bund wall round the tank farm. Tell me line sizes and services."

