id = "H01_lattice_tower_300"
tier = "hard"
group = "Steel structures"
title = "300 m lattice tower with curved legs"
lang = "en"
base = "empty"

[[turn]]
say = "I want a 300 metre tall open-lattice tower in riveted wrought iron, the 19th-century kind. Square base about 125 m wide, four legs that start wide and curve inward as they go up, big arches joining the legs at the bottom, three viewing platforms at roughly 57, 115 and 276 m, x-bracing in every panel with lighter secondary lacing between them, gusset plates and bolted or riveted joints at the nodes, lifts and stairs inside the legs. Check the wind sway at the top and tell me the number. I want real members and joints, not solid blocks."

