id = "H02_hospital_hvac__es"
tier = "hard"
group = "MEP systems"
title = "Hospital wing with full HVAC (es)"
lang = "es"
base = "empty"

[[turn]]
say = "Ala de hospital de cuatro plantas, unos 6000 m2 en total. Habitaciones de hospitalización, dos quirófanos, UCI, laboratorio, diagnóstico por imagen, farmacia, salas del personal y pasillos. Necesito toda la ventilación bien hecha: unidades de tratamiento de aire en una sala de máquinas en cubierta, conductos de impulsión, retorno y extracción dimensionados por caudal, compuertas cortafuego y de humo donde los conductos cruzan muros de sectores, quirófanos y habitaciones de aislamiento con presión distinta a la de los pasillos, patinillos verticales, y cada sala debe recibir aire. Pon el resumen del dimensionado en tu respuesta."

