id = "H03_process_plant__de"
tier = "hard"
group = "Process facilities"
title = "Chemical process plant with pipe racks (de)"
lang = "de"
base = "empty"

[[turn]]
say = "Eine kleine chemische Prozessanlage im Freien: ein Doppelmantel-Reaktor, zwei Vorlagetanks, eine Destillationskolonne mit Aufkocher und Kondensator, Pumpen als Betriebs-/Reservepaare, ein paar Wärmetauscher. Eine Stahl-Rohrbrücke von etwa 4 m Höhe, die die Prozessleitungen zwischen den Apparaten trägt, Stutzen an jedem Behälter mit tatsächlich angeschlossenen Leitungen, Rohre mit Gefälle dort, wo entwässert werden muss, Auflager alle paar Meter, Bedienbühnen und Steigleitern mit Rückenschutz um Kolonne und Reaktor und eine Auffangwanne um das Tanklager. Nenne mir Leitungsdimensionen und Medien."

