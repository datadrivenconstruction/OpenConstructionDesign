id = "H05_tower40_core_fire"
tier = "hard"
group = "High-rise and fire safety"
title = "40-storey tower with core, curtain wall, sprinklers, egress"
lang = "en"
base = "empty"

[[turn]]
say = "40-storey office tower, floor plate about 45 by 45 m. Reinforced concrete core with eight lifts and two protected stairs, glazed curtain-wall facade with a mullion grid, sprinklers on every floor fed from risers in the core, wet risers for the fire brigade, each floor its own fire compartment with rated walls and doors, and at least two ways out from every floor. Show me the egress and fire strategy in your reply."

[[oracle.count]]
spec = "level"
min = 40.0

[[oracle.count]]
spec = "level"
min = 40.0
max = 46.0

[[oracle.count]]
spec = "curtain_wall"
min = 40.0

[[oracle.count]]
spec = "curtain_panel"
min = 800.0

[[oracle.count]]
spec = "comp:sprinkler"
min = 400.0

[[oracle.count]]
spec = "mep:pipe"
min = 150.0

[[oracle.count]]
spec = "shaftmulti+shaft"
min = 4.0

[[oracle.count]]
spec = "stair"
min = 80.0

[[oracle.count]]
spec = "comp:lift|elevator"
min = 8.0

[[oracle.geom]]
kind = "height"
min = 120.0
max = 200.0

[[oracle.geom]]
kind = "mep_connected"
ends_min = 0.9

[[oracle.geom]]
kind = "mep_clashes"
max = 0.0

[[oracle.text]]
name = "gives an egress strategy with numbers"
re = "(egress|evacuat|escape|exit|эвакуац)[^\\n]{0,200}\\d"

[[oracle.text]]
name = "names fire compartments"
re = "compartment|отсек"

[[oracle.claim]]
name = "sprinklers"
say = "sprinkler"
have = "comp:sprinkler"
min = 40.0

[[oracle.claim]]
name = "fire-rated compartments"
say = "fire[- ](rated|compartment)|compartment"
have = "room_sep+wt:fire|EI|REI"
min = 1.0

[oracle.ifc.classes_min]
"IfcBuildingStorey" = 1
"IfcWall" = 1
"IfcSlab" = 1
"IfcDuctSegment|IfcPipeSegment|IfcCableCarrierSegment" = 1

[[oracle.geom]]
kind = "ifc_wellformed"

[[oracle.geom]]
kind = "mep_free_ends"
max = 0.0

[[oracle.geom]]
kind = "sizes_typical"
share_max = 0.25
errors_max = 0.0

[[oracle.receipt]]
field = "created"
min = 1.0

[[oracle.receipt]]
field = "blocked"
max = 0.0

[oracle.checks]
new_max = 0

[[oracle.geom]]
kind = "room_sep"
area_max = 2500.0
stairs_min = 2.0
