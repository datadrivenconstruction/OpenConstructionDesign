id = "G39_radio_dish"
tier = "hard"
group = "Any geometry"
title = "Radio telescope dish"
lang = "en"
base = "empty"

[[turn]]
say = "A 30 m radio telescope: a paraboloid reflector dish with focal ratio 0.4 on a steel back-structure truss, a quadripod holding the receiver at the focus, an alt-azimuth mount on a 15 m concrete pedestal."

[[oracle.count]]
spec = "level"
min = 1.0

[[oracle.count]]
spec = "beam+brace+truss+gridshell_bar"
min = 100.0

[[oracle.count]]
spec = "gridshell+freeform+mesh+solid"
min = 1.0

[[oracle.geom]]
kind = "gaussian_curve"
share_min = 0.3

[[oracle.geom]]
kind = "height"
min = 25.0
max = 50.0

[[oracle.geom]]
kind = "no_dup_members"

[oracle.ifc.classes_min]
"IfcBuildingStorey" = 1
