id = "H11_ru_lattice_tower"
tier = "hard"
group = "Steel structures"
title = "300 m lattice tower (Russian)"
lang = "ru"
base = "empty"

[[turn]]
say = "Хочу ажурную решётчатую башню высотой 300 метров из клёпаного кованого железа, как в XIX веке. Квадратное основание около 125 м, четыре ноги, которые внизу широко расставлены, а выше плавно сходятся по кривой, внизу большие арки между ногами, три смотровые площадки примерно на 57, 115 и 276 м, в каждой панели крестовые связи плюс более лёгкие решётки между ними, фасонки и болтовые или клёпаные узлы, лифты и лестницы внутри ног. Проверь раскачивание от ветра на вершине и назови число. Нужны настоящие стержни и узлы, а не сплошные блоки."

[[oracle.count]]
spec = "level"
min = 3.0

[[oracle.count]]
spec = "col+beam+brace+truss+gridshell_bar"
min = 600.0

[[oracle.count]]
spec = "brace"
min = 150.0

[[oracle.count]]
spec = "steel_conn"
min = 100.0

[[oracle.count]]
spec = "steel_conn_part"
min = 200.0

[[oracle.count]]
spec = "slab"
min = 3.0

[[oracle.count]]
spec = "stair+comp:lift|elevator"
min = 2.0

[[oracle.geom]]
kind = "height"
min = 270.0
max = 330.0

[[oracle.geom]]
kind = "taper"
min = 3.0

[[oracle.geom]]
kind = "curve_dev"
min = 0.03

[[oracle.geom]]
kind = "legs"
min = 4.0

[[oracle.geom]]
kind = "no_dup_members"

[[oracle.claim]]
name = "bolts and plates"
say = "\\b(bolts?|rivets?|gusset|plates?)\\b"
have = "steel_conn_part"
min = 20.0

[oracle.ifc.classes_min]
"IfcBuildingStorey" = 1
"IfcColumn" = 1
"IfcBeam" = 1
"IfcMember" = 1
"IfcSlab" = 1
