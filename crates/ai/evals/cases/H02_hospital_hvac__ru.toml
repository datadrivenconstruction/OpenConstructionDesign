[[oracle.text]]
name = "explains pressure zoning"
re = "(pressur|cascade|negative|positive|isolation|druck|kaskade|presi[oó]n|sobrepresi|depresi|overdruck|давлен)"

[[oracle.text]]
name = "cites a norm or standard"
re = "(EN ?\\d|ISO ?\\d|DIN ?\\d|UNE ?\\d|CTE|RITE|ASHRAE|HTM|VDI|SP ?\\d|СП ?\\d|NFPA|FGI)"

[[oracle.claim]]
name = "fire dampers"
say = "(fire|smoke) damper|brandschutzklappe|rauch\\w*klappe|compuertas? (cortafuego|de humo)|противопожарн\\w+ клапан|дымов\\w+ клапан"
have = "comp:damper"
min = 2.0

