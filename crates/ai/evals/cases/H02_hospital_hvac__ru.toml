id = "H02_hospital_hvac__ru"
tier = "hard"
group = "Инженерные системы"
title = "Hospital wing with full HVAC (ru)"
lang = "ru"
base = "empty"

[[turn]]
say = "Больничный корпус, четыре этажа, всего около 6000 м2. Палаты, две операционные, реанимация, лаборатория, диагностика, аптека, помещения персонала и коридоры. Нужна вся вентиляция, сделанная как следует: приточно-вытяжные установки в венткамере на крыше, воздуховоды притока, вытяжки и удаления, рассчитанные по расходу, противопожарные и дымовые клапаны там, где воздуховоды пересекают стены отсеков, операционные и изоляторы с давлением, отличным от коридоров, вертикальные шахты, и в каждое помещение должен подаваться воздух. Расчёт сечений напиши в ответе."

