id = "H03_process_plant__es"
tier = "hard"
group = "Process facilities"
title = "Chemical process plant with pipe racks (es)"
lang = "es"
base = "empty"

[[turn]]
say = "Una pequeña planta de procesos químicos al aire libre: un reactor encamisado, dos tanques de alimentación, una columna de destilación con rehervidor y condensador, bombas en pares operativa/reserva, un par de intercambiadores de calor. Un puente de tuberías de acero de unos 4 m de altura que lleva las líneas de proceso entre los equipos, boquillas en cada recipiente con las líneas realmente conectadas, tuberías con pendiente donde deben drenar, soportes cada pocos metros, plataformas de acceso y escaleras de gato con jaula alrededor de la columna y el reactor, y un muro de contención alrededor de la zona de tanques. Dime los diámetros de línea y los servicios."

