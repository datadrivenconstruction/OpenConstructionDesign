tier = "hard"
group = "Steel structures"
title = "300 m lattice tower with curved legs (de)"
lang = "de"
base = "empty"

[[turn]]
say = "Ich möchte einen 300 Meter hohen offenen Gitterturm aus genietetem Schmiedeeisen, wie im 19. Jahrhundert. Quadratischer Sockel von etwa 125 m Breite, vier Beine, die unten weit auseinanderstehen und sich nach oben in einer Kurve nach innen neigen, unten große Bögen zwischen den Beinen, drei Aussichtsplattformen bei etwa 57, 115 und 276 m, Kreuzverbände in jedem Feld mit leichterer Nebenvergitterung dazwischen, Knotenbleche und geschraubte oder genietete Knoten, Aufzüge und Treppen in den Beinen. Prüfe die Windauslenkung an der Spitze und nenne mir den Wert. Ich will echte Stäbe und Knoten, keine massiven Blöcke."

