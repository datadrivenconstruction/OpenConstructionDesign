id = "H02_hospital_hvac"
tier = "hard"
group = "MEP systems"
title = "Hospital wing with full HVAC"
lang = "en"
base = "empty"

[[turn]]
say = "Hospital wing, four floors, roughly 6,000 m2 in all. Wards, two operating theatres, an ICU, a lab, imaging, pharmacy, staff rooms and corridors. I need the whole ventilation done properly: air handling units in a rooftop plant room, supply, return and exhaust ducts sized for the flow, fire and smoke dampers where ducts cross compartment walls, operating theatres and isolation rooms kept at a different pressure to the corridors, vertical shafts, and every single room has to get air. Put the sizing summary in your reply."

[[oracle.count]]
spec = "level"
min = 3.0

[[oracle.count]]
spec = "room"
min = 40.0

[[oracle.count]]
spec = "mep_run"
min = 100.0

[[oracle.count]]
spec = "level"
min = 3.0
max = 6.0

[[oracle.count]]
spec = "room:operating|theatre|theater|surg"
min = 2.0

[[oracle.count]]
spec = "room:icu|intensive"
min = 1.0

[[oracle.count]]
spec = "room:ward|patient|bed"
min = 4.0

[[oracle.count]]
spec = "comp:ahu|air.?handling"
min = 2.0

[[oracle.count]]
spec = "mep:duct"
min = 150.0

[[oracle.count]]
spec = "sysk:supply"
min = 1.0

[[oracle.count]]
spec = "sysk:return"
min = 1.0

[[oracle.count]]
spec = "sysk:exhaust|extract"
min = 1.0

[[oracle.count]]
spec = "comp:damper"
min = 8.0

[[oracle.count]]
spec = "shaft"
min = 3.0

[[oracle.geom]]
kind = "mep_connected"
components_max = 1.0
ends_min = 0.9

[[oracle.geom]]
kind = "mep_clashes"
max = 0.0

[[oracle.geom]]
kind = "served_rooms"
terminal = "air_terminal|diffuser|grille"
exclude = "stair|shaft|lift|plant|riser|duct|void|elevator"
share_min = 0.9

[[oracle.text]]
name = "explains pressure zoning"
re = "(pressur|cascade|negative|positive|isolation|overdruck|давлен)"

[[oracle.text]]
name = "cites a norm or standard"
re = "(EN ?\\d|ISO ?\\d|DIN ?\\d|ASHRAE|HTM|VDI|SP ?\\d|СП ?\\d|NFPA|FGI)"

[[oracle.claim]]
name = "fire dampers"
say = "(fire|smoke) damper"
have = "comp:damper"
min = 2.0

[oracle.ifc.classes_min]
"IfcBuildingStorey" = 1
"IfcWall" = 1
"IfcSlab" = 1
"IfcDuctSegment|IfcPipeSegment|IfcCableCarrierSegment" = 1

[[oracle.geom]]
kind = "mep_free_ends"
max = 0.0

[oracle.checks]
new_max = 0

[[oracle.geom]]
kind = "served_rooms"
rooms = "operating|theatre|theater|surg"
terminal = "air_terminal|diffuser|grille"
share_min = 1.0

[[oracle.geom]]
kind = "sizes_typical"
share_max = 0.25
errors_max = 0.0

[[oracle.geom]]
kind = "terminals_fed"
share_min = 0.95
