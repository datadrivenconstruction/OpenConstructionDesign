[[turn]]
say = "Quiero una torre de celosía abierta de 300 metros de altura en hierro forjado remachado, de las del siglo XIX. Base cuadrada de unos 125 m de ancho, cuatro patas que arrancan separadas y se curvan hacia dentro al subir, grandes arcos que unen las patas en la parte baja, tres plataformas de observación a unos 57, 115 y 276 m, arriostramientos en cruz en cada panel con celosía secundaria más ligera entre ellos, cartelas y uniones atornilladas o remachadas en los nudos, ascensores y escaleras dentro de las patas. Comprueba el balanceo por viento en la cima y dime el número. Quiero barras y uniones reales, no bloques macizos."

