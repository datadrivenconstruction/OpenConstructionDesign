[[turn]]
say = "Krankenhausflügel, vier Geschosse, insgesamt etwa 6.000 m². Bettenstationen, zwei Operationssäle, Intensivstation, Labor, Radiologie, Apotheke, Personalräume und Flure. Die komplette Lüftung bitte sauber: Zentralgeräte im Technikraum auf dem Dach, Zuluft-, Abluft- und Fortluftkanäle nach Volumenstrom dimensioniert, Brand- und Rauchschutzklappen an den Brandwänden, OP und Isolierzimmer mit anderem Druck als die Flure, senkrechte Schächte, und jeder einzelne Raum muss Luft bekommen. Schreibe die Dimensionierung in deine Antwort."

