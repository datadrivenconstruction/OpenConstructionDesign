id = "H07_datacenter"
tier = "hard"
group = "MEP systems"
title = "Data center: cooling, cable trays, redundancy"
lang = "en"
base = "empty"

[[turn]]
say = "Data center for about 600 racks in three halls, hot and cold aisle layout on a raised floor. Cooling with chilled water: chillers with N+1 redundancy, CRAH units along the halls, dual-path chilled water piping. Electrical rooms with UPS and batteries, generators outside, overhead cable trays above the racks, fire suppression. Tell me what is redundant and what is not."

[[oracle.count]]
spec = "level"
min = 1.0

[[oracle.count]]
spec = "room:hall|data|white space|server"
min = 3.0

[[oracle.count]]
spec = "comp:rack|cabinet"
min = 400.0

[[oracle.count]]
spec = "comp:crah|crac|cooling unit|cooler"
min = 8.0

[[oracle.count]]
spec = "comp:chiller"
min = 3.0

[[oracle.count]]
spec = "comp:ups"
min = 4.0

[[oracle.count]]
spec = "comp:generator|genset"
min = 3.0

[[oracle.count]]
spec = "sweep+comp:tray+mep:tray|cable"
min = 40.0

[[oracle.count]]
spec = "mep:pipe"
min = 80.0

[[oracle.geom]]
kind = "mep_connected"
components_max = 1.0
ends_min = 0.9

[[oracle.geom]]
kind = "mep_clashes"
max = 0.0

[[oracle.text]]
name = "states the redundancy scheme"
re = "(N\\+1|2N|redundan)"

[oracle.ifc.classes_min]
"IfcBuildingStorey" = 1
"IfcWall" = 1
"IfcSlab" = 1
"IfcDuctSegment|IfcPipeSegment|IfcCableCarrierSegment" = 1

[[oracle.geom]]
kind = "mep_free_ends"
max = 0.0

[oracle.checks]
new_max = 0

[[oracle.geom]]
kind = "sizes_typical"
share_max = 0.25
errors_max = 0.0

[[oracle.geom]]
kind = "aisle_containment"
aisles_min = 2.0
containment_min = 1.0
[[oracle.geom]]
kind = "materials"
