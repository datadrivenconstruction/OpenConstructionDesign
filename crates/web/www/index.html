<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenConstructionDesign Viewer</title>
<meta name="description" content="OpenConstructionDesign in the browser: open a .ddc project or an IFC file, view it in 3D and as level plans, read element properties and run the model checks.">
<style>
  :root { --bg: #1b1d22; --fg: #d6d8dc; --dim: #8a8f98; --accent: #ff8c1a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas#ddc { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; background: var(--bg); z-index: 2; }
  #boot b { font-size: 18px; }
  #boot .bar { width: 260px; height: 4px; background: #2c3038; border-radius: 2px; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #boot small { color: var(--dim); max-width: 520px; text-align: center; padding: 0 16px; }
  #busy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3;
    background: #262a31ee; padding: 14px 20px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<canvas id="ddc"></canvas>
<div id="boot"><b>OpenConstructionDesign</b><div class="bar"><i id="bootbar"></i></div><small id="bootmsg">Loading the engine…</small></div>
<div id="busy"></div>
<input id="file" type="file" accept=".ddc,.ifc" hidden>
<script type="module">
import init, { start, open_bytes, note, state, command } from "./ddc_web.js";

const $ = (id) => document.getElementById(id);
const busy = (t) => { const b = $("busy"); b.textContent = t || ""; b.style.display = t ? "block" : "none"; };

// File picker and drop are handled here; the engine gets bytes.
window.ddcPickFile = () => $("file").click();
$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  busy("Reading " + f.name + "…");
  open_bytes(f.name, new Uint8Array(await f.arrayBuffer()));
  busy("");
  e.target.value = "";
});

async function fetchProject(url) {
  const name = decodeURIComponent(url.split("?")[0].split("/").pop() || "project.ddc");
  busy("Downloading " + name + "…");
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const total = +r.headers.get("content-length") || 0;
    const reader = r.body.getReader();
    const parts = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      busy("Downloading " + name + " " + (got / 1e6).toFixed(1) + (total ? " / " + (total / 1e6).toFixed(1) : "") + " MB");
    }
    const bytes = new Uint8Array(got); let at = 0;
    for (const p of parts) { bytes.set(p, at); at += p.length; }
    open_bytes(name, bytes);
  } catch (e) {
    note("Could not download " + url + ": " + e.message);
  }
  busy("");
}

window.ddc = { state: () => JSON.parse(state()), command, open: fetchProject };

(async () => {
  $("bootbar").style.width = "30%";
  await init();
  $("bootbar").style.width = "80%";
  await start("ddc");
  $("boot").remove();
  const p = new URLSearchParams(location.search).get("project");
  if (p) fetchProject(new URL(p, location.href).href);
})().catch((e) => {
  $("bootmsg").textContent = "This browser could not start the viewer (WebGL2 and WebAssembly are needed): " + e;
  console.error(e);
});
</script>
</body>
</html>
