[package]
name = "ddc-script"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Sandboxed geometry scripts that emit one ops envelope"

# Geometry scripts in a sandbox: script text + params -> one ops envelope. No model, no UI.
[dependencies]
web-time.workspace = true
ddc-ops = { path = "../ops" }
ddc-geom = { path = "../geom" }
ddc-fem = { path = "../fem" }
serde_json.workspace = true
sha2 = "0.10"
# interpreter: MIT, C sources built in (no system library)
mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
