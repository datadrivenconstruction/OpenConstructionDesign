[package]
name = "ddc-web-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Browser bundle of the full editor (docs/BROWSER.md). Empty on desktop targets.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# link: the draft `.ddcrev` is built and read in the page (bridge `save`, `read_file`)
ddc-app = { path = "../app", default-features = false, features = ["web", "link"] }
