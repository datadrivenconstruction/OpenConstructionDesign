[package]
name = "ddc-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "One blocking HTTP transport for the editor: ureq on desktop, the browser's request object on the web"

[dependencies]

# desktop: ureq on the OS TLS stack
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true
native-tls.workspace = true

# browser: already in the tree through the renderer (MIT OR Apache-2.0)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["XmlHttpRequest"] }
