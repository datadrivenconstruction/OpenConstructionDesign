[package]
name = "ddc-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Client of the ERP link (contract ddc-erp-link/1): link file, token, context, lock, revisions"

[dependencies]
web-time.workspace = true
native-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

# Other platforms have no vault integration: the token then lives for the session only.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring.workspace = true

# mock ERP for tests (feature `mock-erp`): the contract schema checker of ddc-io, and to open
# uploaded packages zip (MIT) and sha2 (MIT OR Apache-2.0), both already in the tree
ddc-io = { path = "../io", features = ["link"], optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate"], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
# an in-process ERP speaking the contract, for this crate's and the editor's tests; never shipped
mock-erp = ["dep:ddc-io", "dep:zip", "dep:sha2"]

[[test]]
name = "erp"
required-features = ["mock-erp"]
