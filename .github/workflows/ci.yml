name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'site/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'site/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a run on main always finishes, so main has a verdict
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  names:
    name: licence and trademark lint (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/name_lint.py
      - run: python tools/spdx_headers.py

  test:
    name: test ${{ matrix.unit.crate }}${{ matrix.unit.shard && format(' {0}', matrix.unit.shard) || '' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The slow crates run in shards; tools/ci_shard.py splits them by test target and
        # lib test-name filter so that the shards together run exactly what `cargo test` runs.
        unit:
          - {crate: ddc-bridge-proto}
          - {crate: ddc-model}
          - {crate: ddc-geom}
          - {crate: ddc-solver}
          # link adds the elements.parquet writer and the contract check to the run
          - {crate: ddc-io, features: link}
          - {crate: ddc-render}
          - {crate: ddc-ui}
          - {crate: ddc-ai}
          - {crate: ddc-ops}
          - {crate: ddc-fem}
          - {crate: ddc-calc}
          - {crate: ddc-cli}
          - {crate: ddc-script}
          - {crate: ddc-link}
          - {crate: bigfile-bench}
          - {crate: ddc-app, shard: 1/10}
          - {crate: ddc-app, shard: 2/10}
          - {crate: ddc-app, shard: 3/10}
          - {crate: ddc-app, shard: 4/10}
          - {crate: ddc-app, shard: 5/10}
          - {crate: ddc-app, shard: 6/10}
          - {crate: ddc-app, shard: 7/10}
          - {crate: ddc-app, shard: 8/10}
          - {crate: ddc-app, shard: 9/10}
          - {crate: ddc-app, shard: 10/10}
          - {crate: ddc-gen, shard: 1/7}
          - {crate: ddc-gen, shard: 2/7}
          - {crate: ddc-gen, shard: 3/7}
          - {crate: ddc-gen, shard: 4/7}
          - {crate: ddc-gen, shard: 5/7}
          - {crate: ddc-gen, shard: 6/7}
          - {crate: ddc-gen, shard: 7/7}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev
      - uses: actions/setup-python@v5
        if: matrix.unit.shard
        with:
          python-version: "3.12"
      # One dependency cache per crate and OS, shared by its shards and written by one of them;
      # also written when tests fail, so a red crate does not rebuild its dependencies every run.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.unit.crate }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && (!matrix.unit.shard || startsWith(matrix.unit.shard, '1/')) }}
      - name: build
        if: ${{ !matrix.unit.shard }}
        run: cargo build -p ${{ matrix.unit.crate }} --all-targets --locked ${{ matrix.unit.features && format('--features {0}', matrix.unit.features) || '' }}
      - name: test
        if: ${{ !matrix.unit.shard }}
        run: cargo test -p ${{ matrix.unit.crate }} --locked --no-fail-fast ${{ matrix.unit.features && format('--features {0}', matrix.unit.features) || '' }}
      - name: build shard
        if: matrix.unit.shard
        shell: bash
        run: python tools/ci_shard.py build ${{ matrix.unit.crate }} ${{ matrix.unit.shard }}
      - name: test shard
        if: matrix.unit.shard
        shell: bash
        run: python tools/ci_shard.py run ${{ matrix.unit.crate }} ${{ matrix.unit.shard }}

  wasm:
    name: browser build check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends clang llvm
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # the C parts of SQLite and zstd are compiled for wasm32 by the runner's clang
      - name: cargo check
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: cargo check --locked -p ddc-web-editor --target wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bundle tools
        run: |
          python tools/test_bundle_manifest.py
          python tools/test_web_entry.py

  fmt:
    name: fmt (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The tree is not yet formatted in one pass; this job reports and does not block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check

  clippy:
    name: clippy (warnings allowed)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked --keep-going --color never --message-format=short 2> clippy.txt || { grep -E '^[^ ]+: error|^error' clippy.txt | head -n 200; exit 1; }
          {
            echo "### clippy warnings (not blocking yet)"
            echo '```'
            grep -E '^(warning|error)' clippy.txt | sed -E 's/^[^ ]+ //' | sort | uniq -c | sort -rn | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -cE '^[^ ]+: warning' clippy.txt || true

  macos-check:
    name: macOS build check (beta, advisory)
    runs-on: macos-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: check
        run: cargo check --locked -p ddc-app -p ddc-cli

  supply:
    name: supply chain (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - if: ${{ !cancelled() }}
        run: python3 tools/closed_deps_check.py

  ci-ok:
    name: ci ok
    if: always()
    needs: [names, test, clippy, supply]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          [ "${{ needs.names.result }}" = success ] && [ "${{ needs.test.result }}" = success ] \
            && [ "${{ needs.clippy.result }}" = success ] && [ "${{ needs.supply.result }}" = success ]
