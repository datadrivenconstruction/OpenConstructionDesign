name: release
on:
  push:
    # browser releases (v*-web.N) are built by web-erp-release.yml, not here
    tags: ['v*', '!v*-web*']
  # Rebuild assets of an existing release, e.g. targets: '["ubuntu-22.04"]'.
  workflow_dispatch:
    inputs:
      tag: {description: 'existing release tag', required: true}
      targets: {description: 'JSON list of runners', default: '["windows-latest", "ubuntu-22.04"]'}
      macos: {description: 'also build the macOS beta (Apple silicon and Intel)', type: boolean, default: true}
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  create:
    name: create release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: draft notes and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          notes="Release $TAG."
          case "$TAG" in
            *-*) pre="--prerelease"
                 notes="Test build $TAG for trying the editor. Not every automated test passes yet; please report problems you find." ;;
          esac
          printf '%s\n\nDownloads: Windows (zip) and Linux (tar.gz) builds of the editor (ddc-app) and the command line tool (ddc).\n\nmacOS build is beta: built by CI, not tested on a Mac. The macos-beta archives (arm64 for Apple silicon, x64 for Intel) are not signed; if macOS blocks them, run: xattr -dr com.apple.quarantine <folder>\n' "$notes" > notes.md
          gh release create "$TAG" $pre --title "OpenConstructionDesign $TAG" --notes-file notes.md --generate-notes

  build:
    name: build ${{ matrix.os }}
    needs: create
    if: ${{ !cancelled() && (needs.create.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported runner: the binaries need the glibc they were linked against.
        os: ${{ fromJSON(inputs.targets || '["windows-latest", "ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev
      - name: build
        shell: bash
        run: cargo build --release --locked -p ddc-app -p ddc-cli
      - name: smoke test
        shell: bash
        run: |
          target/release/ddc --version
          target/release/ddc-app --help > /dev/null
          if [ "$RUNNER_OS" = "Linux" ]; then
            for b in ddc ddc-app; do
              v=$(objdump -T "target/release/$b" | grep -o 'GLIBC_2\.[0-9]*' | sort -t. -k2 -n -u | tail -1)
              echo "$b needs $v"
              [ "${v#GLIBC_2.}" -le 35 ] || { echo "$b needs $v, more than Ubuntu 22.04 has"; exit 1; }
            done
          fi
      - name: package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="OpenConstructionDesign-$TAG"
          mkdir -p "pkg/$name"
          cp LICENSE NOTICE README.md THIRD_PARTY_LICENSES.txt "pkg/$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/ddc-app.exe target/release/ddc.exe "pkg/$name/"
            (cd pkg && 7z a -tzip "$name-windows-x64.zip" "$name" > /dev/null)
            asset="pkg/$name-windows-x64.zip"
          else
            cp target/release/ddc-app target/release/ddc "pkg/$name/"
            tar -C pkg -czf "pkg/$name-linux-x64.tar.gz" "$name"
            asset="pkg/$name-linux-x64.tar.gz"
          fi
          gh release upload "$TAG" "$asset" --clobber

  build-macos:
    name: build macOS beta ${{ matrix.arch }}
    needs: create
    if: ${{ !cancelled() && (needs.create.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.macos)) }}
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, target: aarch64-apple-darwin}
          - {arch: x64, target: x86_64-apple-darwin}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ddc-app -p ddc-cli
      - name: smoke test
        run: |
          out=target/${{ matrix.target }}/release
          file "$out/ddc" "$out/ddc-app"
          "$out/ddc" --version
          "$out/ddc-app" --help > /dev/null
      - name: package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=target/${{ matrix.target }}/release
          name="OpenConstructionDesign-${TAG//\//-}"
          mkdir -p "pkg/$name"
          cp LICENSE NOTICE README.md THIRD_PARTY_LICENSES.txt "$out/ddc-app" "$out/ddc" "pkg/$name/"
          {
            echo "macOS build is beta: built by CI, not tested on a Mac."
            echo "The binaries are not signed or notarized. If macOS refuses to open them, run:"
            echo "  xattr -dr com.apple.quarantine ."
          } > "pkg/$name/MACOS-BETA.txt"
          asset="pkg/$name-macos-${{ matrix.arch }}-beta.tar.gz"
          tar -C pkg -czf "$asset" "$name"
          if [ "${{ github.event_name }}" = push ] || gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            echo "no release $TAG; asset kept as a workflow artifact only"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: macos-${{ matrix.arch }}-beta
          path: ${{ env.ASSET }}
