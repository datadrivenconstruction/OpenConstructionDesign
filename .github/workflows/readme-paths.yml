name: readme paths
on:
  push:
    branches: [main]
    paths: ['README.md', 'tools/readme_paths.py', 'crates/script/data/recipes/**', 'docs/**']
  pull_request:
    paths: ['README.md', 'tools/readme_paths.py', 'crates/script/data/recipes/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readme-paths:
    name: every path in README exists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/readme_paths.py
