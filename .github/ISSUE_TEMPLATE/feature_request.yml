name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: What are you trying to accomplish?
    validations: { required: true }
  - type: textarea
    id: gap
    attributes:
      label: Why current tools do not cover it
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Optional. Describe what you would expect, not an implementation.
  - type: checkboxes
    id: scope
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the documentation.
          required: true
